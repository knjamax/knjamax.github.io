  /* ===== FLOATING BUTTON ===== */
  .chat-toggle-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #0077B6, #00B4D8, #2EC4B6);
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,119,182,0.45);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .chat-toggle-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 28px rgba(0,119,182,0.55);
  }
  .chat-toggle-btn .icon-chat { display: block; }
  .chat-toggle-btn .icon-close { display: none; }
  .chat-toggle-btn.active .icon-chat { display: none; }
  .chat-toggle-btn.active .icon-close { display: block; }

  /* Pulse animation */
  .chat-toggle-btn::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: rgba(0,119,182,0.3);
    animation: pulse-ring 2s infinite;
    z-index: -1;
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .chat-toggle-btn.active::after { animation: none; }

  /* ===== CHAT WINDOW ===== */
  .chat-window {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 380px;
    max-width: calc(100vw - 48px);
    height: 540px;
    max-height: calc(100vh - 140px);
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 99998;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .chat-window.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: all;
  }

  /* ===== HEADER ===== */
  .chat-header {
    background: linear-gradient(135deg, #0077B6, #00B4D8);
    color: #fff;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .chat-header-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #0077B6;
    font-size: 14px;
    flex-shrink: 0;
    letter-spacing: -0.5px;
  }
  .chat-header-info h3 {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
  }
  .chat-header-info p {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
  }
  .chat-header-lang {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }
  .lang-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }
  .lang-btn:hover, .lang-btn.active {
    background: rgba(255,255,255,0.35);
  }

  /* ===== MESSAGES AREA ===== */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f4f7fa;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: #c0d6e4; border-radius: 10px; }

  /* ===== BUBBLES ===== */
  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    animation: fadeInUp 0.3s ease;
    word-wrap: break-word;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble.bot {
    align-self: flex-start;
    background: #fff;
    color: #1a2a3a;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #0077B6, #00B4D8);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .typing-indicator {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: #fff;
    border-radius: 18px;
    border-bottom-left-radius: 4px;

  .typing-indicator span {
    width: 8px;
    height: 8px;
    background: #93b5cf;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

      const text = t(key);
      addBubble(text, 'bot');
    }, 600 + Math.random() * 400);
  }

  function renderQuickReplies() {
    quickRepliesEl.innerHTML = '';
    const qrs = t('quickReplies');
    if (!qrs || !qrs.length) return;
    qrs.forEach(function(qr) {
      const btn = document.createElement('button');
      btn.className = 'quick-reply-btn';
      btn.textContent = qr.label;
      btn.addEventListener('click', function() {
        handleQuickReply(qr.value, qr.label);
      });
      quickRepliesEl.appendChild(btn);
    });
  }

  function handleQuickReply(value, label) {
    addBubble(label, 'user');
    quickRepliesEl.innerHTML = '';
    switch (value) {
      case 'services': botReply('serviceList'); setTimeout(renderQuickReplies, 1200); break;
      case 'contact': botReply('contact'); setTimeout(renderQuickReplies, 1200); break;
      case 'location': botReply('location'); setTimeout(renderQuickReplies, 1200); break;
      case 'hours': botReply('hours'); setTimeout(renderQuickReplies, 1200); break;
      case 'pricing': botReply('pricing'); setTimeout(renderQuickReplies, 1200); break;
      case 'online_apps': botReply('onlineApps'); setTimeout(renderQuickReplies, 1200); break;
      default: botReply('fallback'); setTimeout(renderQuickReplies, 1200);
    }
  }

  // ===== MESSAGE CLASSIFIER =====
  function classifyMessage(msg) {
    const lower = msg.toLowerCase().trim();

    // Greetings
    const greetings = ['hi', 'hello', 'hey', 'habari', 'jambo', 'shikamoo', 'mambo', 'sasa', 'morning', 'hujambo', 'tusenjile', 'good morning', 'good evening', 'good afternoon', 'karibu'];
    if (greetings.some(g => lower.includes(g))) return 'greeting';

    // Services
    const services = ['service', 'huduma', 'services', 'wafanya', 'mnafanya', 'do you do', 'offer', 'hudum', 'mtandao', 'network', 'networking', 'grafik', 'design', 'banner', 'flyer', 'logo', 'card', 'picha', 'picture', 'program', 'programu', 'windows', 'antivirus', 'update', 'kompyuta', 'computer', 'simu', 'phone', 'repair', 'tengene', 'office', 'mafunzo', 'training', 'jifunze', 'learn', 'excel', 'word', 'powerpoint'];
    if (services.some(s => lower.includes(s))) return 'services';

    // Contact
    const contacts = ['contact', 'wasiliana', 'email', 'whatsapp', 'simu', 'phone number', 'number', 'namba', 'insta', 'instagram', 'tiktok', 'wasiliane', 'piga', 'call', 'message', 'msg', 'ujumbe'];
    if (contacts.some(c => lower.includes(c))) return 'contact';

    // Location
    const locations = ['location', 'mahali', 'wapi', 'where', 'singida', 'ofisi', 'office', 'address', 'addressi', 'mkoa', 'town', 'mjini'];
    if (locations.some(l => lower.includes(l))) return 'location';

    // Hours
    const hours = ['hour', 'saa', 'time', 'wakati', 'masaa', 'when', 'lini', 'opening', 'funua', 'funge', 'siku', 'day', 'monday', 'jumatatu', 'saturday', 'jumamosi'];
    if (hours.some(h => lower.includes(h))) return 'hours';

    // Pricing
    const pricing = ['price', 'bei', 'cost', 'gharama', 'how much', 'kiasi', 'ngapi', 'cheap', 'nafuu', 'rafiki', 'affordable'];
    if (pricing.some(p => lower.includes(p))) return 'pricing';

    // Online Apps
    const apps = ['nida', 'tin', 'tcu', 'nacte', 'passport', 'napa', 'heslb', 'application', 'maombi', 'certificate', 'hati', 'license', 'leseni', 'biashara', 'business', 'mtandaoni', 'online', 'register', 'sajili', 'kusajili', 'registration', 'birth', 'death', 'kuzaliwa', 'kufariki', 'tin', 'passport', 'nida'];
    if (apps.some(a => lower.includes(a))) return 'online_apps';

    // Jobs
    const jobs = ['job', 'kazi', 'ajira', 'maombi', 'application', 'cv', 'resume', 'employment', 'employment', 'apply', 'omba'];
    if (jobs.some(j => lower.includes(j))) return 'jobs';

    // Repair
    const repair = ['repair', 'broken', 'haribika', 'hitilafu', 'error', 'problem', 'shida', 'tatizo', 'haifanyi', 'si kufanya', 'not working', 'slow', 'pole', 'virus'];
    if (repair.some(r => lower.includes(r))) return 'repair';

    // Training
    const train = ['train', 'mafunzo', 'learn', 'jifunze', 'teach', 'fundisha', 'course', 'kozi', 'computer skill', 'ujuzi'];
    if (train.some(t => lower.includes(t))) return 'training';

    // Graphic Design
    const graphic = ['design', 'ubunifu', 'grafiki', 'graphic', 'banner', 'flyer', 'poster', 'logo', 'card', 'business card', 'kadi'];
    if (graphic.some(g => lower.includes(g))) return 'graphic';

    // Networking
    const networking = ['network', 'mtandao', 'wifi', 'lan', 'router', 'cable', 'kebo', 'internet', 'mtandao'];
    if (networking.some(n => lower.includes(n))) return 'networking';

    // Thanks
    const thanks = ['thanks', 'asante', 'thank you', 'shukrani', 'zuri', 'cool', 'nice', 'great', 'vizuri', 'mzuri'];
    if (thanks.some(tk => lower.includes(tk))) return 'thanks';

    // Default
    return 'fallback';
  }

  function handleUserMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    addBubble(text, 'user');
    chatInput.value = '';
    quickRepliesEl.innerHTML = '';

    const category = classifyMessage(text);
    const keyMap = {
      'greeting': 'hello',
      'services': 'serviceList',
      'contact': 'contact',
      'location': 'location',
      'hours': 'hours',
      'pricing': 'pricing',
      'online_apps': 'onlineApps',
      'jobs': 'jobs',
      'repair': 'repair',
      'training': 'training',
      'graphic': 'graphic',
      'networking': 'networking',
      'thanks': 'thanks',
      'fallback': 'fallback'
    };

    botReply(keyMap[category] || 'fallback');
    setTimeout(renderQuickReplies, 1200);
  }

  // ===== EVENT LISTENERS =====
  toggleBtn.addEventListener('click', function() {
    chatOpen = !chatOpen;
    chatWindow.classList.toggle('open', chatOpen);
    toggleBtn.classList.toggle('active', chatOpen);
    if (chatOpen) {
      chatInput.focus();
      if (messagesEl.children.length === 0) {
        setTimeout(function() {
          botReply('greeting');
          setTimeout(renderQuickReplies, 1000);
        }, 300);
      }
    }
  });

  sendBtn.addEventListener('click', handleUserMessage);
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleUserMessage();
    }
  });

  // Language switch
  langSwBtn.addEventListener('click', function() {
    currentLang = 'sw';
    langSwBtn.classList.add('active');
    langEnBtn.classList.remove('active');
    headerStatus.textContent = t('status');
    chatInput.placeholder = t('placeholder');
    addBubble('Lugha imebadilishwa kuwa Kiswahili. 🇹🇿', 'bot');
    renderQuickReplies();
  });

  langEnBtn.addEventListener('click', function() {
    currentLang = 'en';
    langEnBtn.classList.add('active');
    langSwBtn.classList.remove('active');
    headerStatus.textContent = t('status');
    chatInput.placeholder = t('placeholder');
    addBubble('Language changed to English. 🇺🇸', 'bot');
    renderQuickReplies();
  });

  // Auto-detect language from browser
  (function detectLang() {
    const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    if (browserLang.startsWith('sw')) {
      currentLang = 'sw';
      langSwBtn.classList.add('active');
      langEnBtn.classList.remove('active');
    } else {
      currentLang = 'en';
      langEnBtn.classList.add('active');
      langSwBtn.classList.remove('active');
    }
  })();

})();
</script>

</body>
